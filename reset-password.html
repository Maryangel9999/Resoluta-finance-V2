  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script> <!-- ou o caminho correto do seu arquivo de conexão -->

  <script>
    function showAlert(message, type) {
      const alertElement = document.getElementById('alert-msg');
      alertElement.textContent = message;
      alertElement.className = `alert alert-${type}`;
      alertElement.style.display = 'block';
    }

    function hideAlert() {
      const alertElement = document.getElementById('alert-msg');
      alertElement.style.display = 'none';
    }

    async function handleResetPassword(event) {
      event.preventDefault();
      hideAlert();

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btnSubmit = document.getElementById('btn-submit');

      if (newPassword !== confirmPassword) {
        showAlert('As senhas não coincidem. Por favor, verifique.', 'error');
        return;
      }

      if (newPassword.length < 6) {
        showAlert('A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }

      try {
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Atualizando...';

        // Utiliza o cliente Supabase existente no projeto (ex: window.supabase ou a variável exportada no seu supabase.js)
        const client = window.supabaseClient;

        const { data, error } = await client.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        showAlert('Senha alterada com sucesso! Redirecionando...', 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);

      } catch (error) {
        console.error('Erro ao redefinir senha:', error);
        showAlert(error.message || 'Erro ao redefinir a senha. O link pode ter expirado.', 'error');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Salvar Nova Senha';
      }
    }
  </script>
